# cargo-deny конфиг (AUDIT M15). Запуск: `cargo deny check` (нужен
# `cargo install cargo-deny`). Рекомендуется добавить в CI перед релизом:
# проверяет RUSTSEC-advisories (в т.ч. vendored-OpenSSL/ml-kem), yanked-крейты,
# лицензии и источники зависимостей.

[advisories]
# Падать на yanked-версиях; уязвимости из RustSec advisory-db проверяются по
# умолчанию (в новых версиях cargo-deny это всегда deny).
yanked = "deny"
ignore = []

[licenses]
# Разрешённые лицензии (permissive + weak-copyleft, приемлемо для этого продукта).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
# Дубли версий одного крейта — предупреждение (раздувают бинарник/поверхность).
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
