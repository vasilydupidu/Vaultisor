# cargo-deny конфиг (AUDIT M15).

# Vaultisor собирается только под Windows x64. Без этого ограничения проверки
# идут по объединённому графу всех платформ и спотыкаются о GTK/glib, которые
# в продукт не попадают ни одной строкой.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.20+ treats security advisories as errors by default.
# Limit maintenance-status checks to crates owned by this workspace so that
# platform-specific transitive dependencies do not block a release.
unmaintained = "workspace"
ignore = []

# Продукт распространяется под GPL-3.0-only. Зависимости обязаны быть
# совместимы с ней; OpenSSL здесь 3.x, то есть Apache-2.0, а не старая
# несовместимая с GPL лицензия OpenSSL.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
# Разные версии одного крейта в графе Tauri — норма и не риск.
multiple-versions = "warn"
# Зависимость с версией "*" принимает что угодно при следующем обновлении,
# включая мажорную смену поведения. В графе таких нет — держим запрет.
wildcards = "deny"
# Исключение — только path-зависимости внутри workspace: core-shared это наш
# собственный крейт из этого же репозитория, версии у него нет и не нужно,
# подменить его извне нельзя.
allow-wildcard-paths = true

[sources]
# Крейт не из crates.io и не из git-репозитория, перечисленного ниже, —
# это подмена источника, а не удобство. Оба варианта блокируют сборку.
unknown-registry = "deny"
unknown-git = "deny"
