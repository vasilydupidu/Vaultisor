name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + vitest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm test

  backend:
    name: Backend (cargo check + unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM
        uses: ilammy/setup-nasm@v1
      - name: Ensure Perl in PATH
        shell: bash
        run: echo "C:/Program Files/Git/usr/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - name: Cargo Check Core Crypto
        run: cargo check --package core-shared
      - name: Cargo Test Core Crypto
        run: cargo test --package core-shared --lib
