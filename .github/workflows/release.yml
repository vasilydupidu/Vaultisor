name: Release

# build → неизменяемый артефакт → publish.
#
# - build собирает бинарник один раз, без кэшей и с правами только на чтение,
#   и выкладывает его вместе с SHA256SUMS и build-info как артефакт run'а;
# - attest подписывает provenance артефакта (Sigstore); без неё релиз
#   не публикуется;
# - publish ничего не собирает: скачивает тот же артефакт, сверяет хэши и
#   публикует. Право на запись в репозиторий есть только у этого job'а.
#
# Запускается только вручную:
#   gh workflow run release.yml                           — пробная сборка, без публикации;
#   gh workflow run release.yml --ref vX.Y.Z -f publish=true — релиз с тега.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать GitHub Release (только с тега vX.Y.Z)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # `./` — тот же коммит, что и этот workflow: изменяемой ссылки нет.
    # Синтаксис `$/` не используется, пока его нельзя проверить реальным запуском.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      cache: false
    permissions:
      contents: read

  build:
    name: Build portable executable
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ref matches the product version
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF -ne "v$version") {
              throw "Tag $env:REF does not match package.json version $version"
            }
          } elseif ($env:PUBLISH -eq "true") {
            throw "Publishing requires a tag: gh workflow run release.yml --ref v$version -f publish=true"
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - name: Ensure Strawberry Perl in PATH
        shell: bash
        run: |
          echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
          echo "C:/Strawberry/c/bin" >> "$GITHUB_PATH"

      # Без install-скриптов: код зависимостей не исполняется в job'е, который
      # собирает публикуемый бинарник. Сборке они не нужны.
      - name: Install dependencies
        run: npm ci --no-fund --ignore-scripts

      - name: Build portable executable
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipDeps

      - name: Checksums and build information
        shell: pwsh
        env:
          REF: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # build.ps1 emits exactly one versioned artifact. More than one means
          # a stale file is lying around, and publishing the wrong one would
          # be worse than failing here.
          $exe = @(Get-ChildItem "release/Vaultisor-*.exe")
          if ($exe.Count -ne 1) {
            throw "Expected exactly one release/Vaultisor-<version>.exe, found $($exe.Count)"
          }
          $exe = $exe[0]
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format, LF line endings: publish verifies it on Linux.
          [IO.File]::WriteAllText("release/SHA256SUMS.txt", "$hash  $($exe.Name)`n")
          $info = [ordered]@{
            ref       = $env:REF
            commit    = $env:COMMIT
            run_id    = $env:RUN_ID
            rustc     = (rustc --version)
            node      = (node --version)
            artifact  = $exe.Name
            sha256    = $hash
            signature = "unsigned (no Authenticode)"
          }
          $info | ConvertTo-Json | Set-Content "release/build-info.json" -Encoding utf8
          Get-Content "release/build-info.json"

      - name: Upload immutable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultisor-release
          path: |
            release/Vaultisor-*.exe
            release/SHA256SUMS.txt
            release/build-info.json
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Build provenance attestation
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC-токен для подписи provenance (Sigstore)
      attestations: write # запись attestation в репозиторий
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vaultisor-release
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Vaultisor-*.exe

  publish:
    name: Publish GitHub release
    needs: [build, attest]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # создание релиза и загрузка его файлов
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release_notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vaultisor-release
          path: dist

      - name: Verify the artifact before publishing
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          test "$(find . -name 'Vaultisor-*.exe' | wc -l)" -eq 1

      - name: Create release from the verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "Vaultisor $TAG" \
            --notes-file .github/release_notes.md \
            dist/Vaultisor-*.exe dist/SHA256SUMS.txt dist/build-info.json
