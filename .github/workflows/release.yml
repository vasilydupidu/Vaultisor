name: Release & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Sign & Release Vaultisor
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: npm install

      - name: Build Portable Executable
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipDeps

      - name: Sign Executable with SignPath PowerShell Module
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module -Name SignPath -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
            Submit-SigningRequest `
              -InputArtifactPath "release/Vaultisor.exe" `
              -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
              -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
              -ProjectSlug "vaultisor" `
              -SigningPolicySlug "release-signing" `
              -OutputArtifactPath "release/Vaultisor-signed.exe" `
              -WaitForCompletion -ErrorAction Stop
          } catch {
            Write-Host "SignPath Notification: $_"
          }
          if (Test-Path "release/Vaultisor-signed.exe") {
            Copy-Item -Force "release/Vaultisor-signed.exe" "release/Vaultisor.exe"
            Write-Host "Successfully signed binary with SignPath!"
          }
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Vaultisor.exe
          body: |
            ## Vaultisor ${{ github.ref_name }} 🛡️
            
            Защищённое автономное (Air-Gapped) Windows-приложение для локального хранения технических секретов, API-ключей, сертификатов и паролей сайтов.
            
            ### 🌟 Что нового в версии 2.7.0:
            
            - 🔑 **Аппаратные ключи FIDO2 / WebAuthn (Рутокен MFA, YubiKey и др.)**:
              - **Полная переработка и универсальная поддержка FIDO2** через нативный API `webauthn.dll` (Windows 10/11).
              - **Два режима аутентификации**:
                - 🛡️ **ПИН + Touch** (*Resident Key / User Verification Required*) — максимальная безопасность с вводом аппаратного ПИН-кода и касанием токена.
                - 👆 **Touch-only** (*Passwordless 2FA / User Verification Discouraged*) — сверхбыстрая разблокировка по касанию без ПИН-кода.
              - **Автоматическая идентификация по AAGUID**: Распознавание моделей ключей (Рутокен MFA, YubiKey 5 NFC/Nano/Bio, Security Key by Yubico и др.).
              - **Мульти-ключи**: Подключение и управление несколькими ключами с отображением модели и модальным диалогом подтверждения удаления.
            
            - 🩺 **Анализ стойкости и подсветка слабых паролей (Health Check)**:
              - Автоматический аудит и выявление дублирующихся (повторно используемых), коротких и простых паролей.
              - Наглядная цветовая индикация уровня безопасности и предупреждения в реальном времени.
            
            - 📜 **История паролей**:
              - Автоматическое сохранение предыдущих ревизий паролей при редактировании секрета.
              - Безопасный просмотр истории изменений и копирование старых значений.
            
            - 🌐 **Мультиязычный интерфейс (i18n RU / EN)**:
              - Полная поддержка двух языков с мгновенным переключением в настройках.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
