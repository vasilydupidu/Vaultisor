name: Release & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Sign & Release Vaultisor
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: npm install

      - name: Build Portable Executable
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipDeps

      - name: Sign Executable with SignPath PowerShell Module
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module -Name SignPath -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
            Submit-SigningRequest `
              -InputArtifactPath "release/Vaultisor.exe" `
              -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
              -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
              -ProjectSlug "vaultisor" `
              -SigningPolicySlug "release-signing" `
              -OutputArtifactPath "release/Vaultisor-signed.exe" `
              -WaitForCompletion -ErrorAction Stop
          } catch {
            Write-Host "SignPath Notification: $_"
          }
          if (Test-Path "release/Vaultisor-signed.exe") {
            Copy-Item -Force "release/Vaultisor-signed.exe" "release/Vaultisor.exe"
            Write-Host "Successfully signed binary with SignPath!"
          }
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Vaultisor.exe
          body: |
            ## Vaultisor ${{ github.ref_name }} 🛡️
            
            [**Русский**](#-что-нового-в-версии-270) | [**English**](#-whats-new-in-v270)
            
            ---
            
            ### 🇷🇺 Что нового в версии 2.7.0:
            
            - 🔑 **Аппаратные ключи FIDO2 / WebAuthn (Рутокен MFA, YubiKey и др.)**:
              - **Полный рефакторинг FFI** для нативной поддержки через системную библиотеку `webauthn.dll` (Windows 10/11).
              - **Два режима аутентификации**:
                - 🛡️ **ПИН + Touch** (*Resident Key / User Verification Required*) — максимальная двухфакторная безопасность.
                - 👆 **Touch-only** (*Passwordless 2FA / User Verification Discouraged*) — сверхбыстрая разблокировка по касанию без ввода ПИН-кода.
              - **Автоматическая идентификация по AAGUID**: Точное определение моделей ключей (Рутокен MFA, YubiKey 5 NFC/Nano/Bio, Security Key by Yubico и др.).
              - **Мульти-ключевой менеджмент**: Подключение нескольких токенов, отображение бейджей моделей и подтверждение удаления.
            
            - 🩺 **Анализ стойкости и подсветка слабых паролей (Health Check)**:
              - Автоматический аудит и подсвечивание повторно используемых (дублирующихся), коротких и простых паролей.
            
            - 📜 **История паролей**:
              - Автоматическое сохранение прошлых ревизий паролей с возможностью безопасного просмотра и копирования старых значений.
            
            - 🌐 **Мультиязычный интерфейс (i18n RU / EN)**:
              - Переключение языка «на лету» с сохранением настроек.
            
            ---
            
            ### 🇬🇧 What's new in v2.7.0:
            
            - 🔑 **FIDO2 / WebAuthn Hardware Security Keys (Rutoken MFA, YubiKey, etc.)**:
              - **Full FFI Refactor** for native support via Windows `webauthn.dll` API (Windows 10/11).
              - **Dual Authentication Modes**:
                - 🛡️ **PIN + Touch** (*Resident Key / User Verification Required*) — maximum 2FA security requiring hardware PIN + token tap.
                - 👆 **Touch-only** (*Passwordless 2FA / User Verification Discouraged*) — instant vault unlock on token contact without PIN entry.
              - **AAGUID Model Auto-Detection**: Identifies physical hardware models out-of-the-box (Rutoken MFA, YubiKey 5 NFC/Nano/Bio, Security Key by Yubico, etc.).
              - **Multi-Key Management**: Register multiple security keys, view model badges, and manage keys with deletion confirmation dialogs.
            
            - 🩺 **Password Health Check & Security Audit**:
              - Real-time audit highlighting duplicate (reused), weak, or simple passwords across your vault.
            
            - 📜 **Password History**:
              - Automatic versioning of previous password revisions whenever credentials are edited, with dedicated history view.
            
            - 🌐 **Multilingual UI (i18n RU / EN)**:
              - Instant language switching with encrypted preference persistence.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
