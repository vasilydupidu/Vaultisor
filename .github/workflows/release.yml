name: Release & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Sign & Release Vaultisor
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: npm install

      - name: Build Portable Executable
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipDeps

      - name: Upload unsigned artifact for SignPath
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: release/Vaultisor.exe

      - name: Submit to SignPath for Signing
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'vaultisor'
          signing-policy-slug: 'release-signing'
          github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

      - name: Download signed artifact from SignPath
        uses: actions/download-artifact@v4
        with:
          name: signed-exe
          path: release-signed
        continue-on-error: true

      - name: Use Signed Binary if Available
        shell: powershell
        run: |
          if (Test-Path "release-signed") {
            $signed = Get-ChildItem -Path "release-signed" -Filter "*.exe" -Recurse | Select-Object -First 1
            if ($signed) {
              Copy-Item -Force $signed.FullName "release/Vaultisor.exe"
              Write-Host "Successfully replaced with signed executable!"
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Vaultisor.exe
          body: |
            ## Vaultisor ${{ github.ref_name }} 🛡️
            
            Локальный автономный менеджер паролей и технических секретов для Windows.
            
            ### Что нового в v2.5.1:
            - 🔑 **Экспорт долей Шамира**: Сохранение долей восстановления в `.txt` файл теперь производится в готовой однострочной форме `3|hex` для моментального копирования в 1 клик.
            - 🎨 **Обновление иконки**: Полностью пересобраны все системные иконки приложения (`.ico`, `.png`) высокой чёткости без искажений.
            - 🌐 **Мультиязычность (i18n)**: Добавлена полноценная поддержка английского и русского языков с сохранностью выбора в зашифрованных настройках.
            - ⚡ **Оптимизация CI/CD**: Сборка релиза переведена на актуальное окружение Node.js 22.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
