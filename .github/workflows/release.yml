name: Release & Sign

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Sign & Release Vaultisor
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Dependencies
        run: npm install

      - name: Build Portable Executable
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -SkipDeps

      - name: Sign Executable with SignPath PowerShell Module
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction SilentlyContinue
            Install-Module -Name SignPath -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
            Submit-SigningRequest `
              -InputArtifactPath "release/Vaultisor.exe" `
              -ApiToken "${{ secrets.SIGNPATH_API_TOKEN }}" `
              -OrganizationId "${{ secrets.SIGNPATH_ORGANIZATION_ID }}" `
              -ProjectSlug "vaultisor" `
              -SigningPolicySlug "release-signing" `
              -OutputArtifactPath "release/Vaultisor-signed.exe" `
              -WaitForCompletion -ErrorAction Stop
          } catch {
            Write-Host "SignPath Notification: $_"
          }
          if (Test-Path "release/Vaultisor-signed.exe") {
            Copy-Item -Force "release/Vaultisor-signed.exe" "release/Vaultisor.exe"
            Write-Host "Successfully signed binary with SignPath!"
          }
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Vaultisor.exe
          body_path: .github/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Update Release Body via GitHub REST API
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = "${{ github.ref_name }}"
          $bodyContent = [System.IO.File]::ReadAllText(".github/release_notes.md", [System.Text.Encoding]::UTF8)
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers -Method Get
            if ($rel -and $rel.id) {
              $updatePayload = @{
                body = $bodyContent
              } | ConvertTo-Json -Depth 5
              Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($rel.id)" -Headers $headers -Method Patch -Body $updatePayload -ContentType "application/json; charset=utf-8"
              Write-Host "Successfully updated release description via GitHub REST API!"
            }
          } catch {
            Write-Host "Notice during REST API update: $_"
          }
