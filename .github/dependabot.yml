version: 2

# Actions закреплены по SHA коммита, а не по тегу: тег — движущаяся ссылка,
# и её владелец (или тот, кто угонит его аккаунт) может перенаправить её на
# другой код, который выполнится здесь с доступом к GITHUB_TOKEN. Именно так
# в марте 2025 через tj-actions/changed-files собрали секреты из тысяч
# репозиториев.
#
# Цена пина — ручное обновление. Её снимает Dependabot: он присылает PR с
# новым SHA и комментарием-версией, и решение об обновлении остаётся явным.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Rust и npm уже проверяются на уязвимости в audit.yml, но тот находит
  # только то, о чём есть advisory. Регулярное обновление уменьшает окно
  # между выходом исправления и его появлением в сборке.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
