[package]
name = "core-shared"
version = "2.0.0"
authors = ["Vaultisor"]
license = "GPL-3.0-only"
# На crates.io не публикуется: это приложение и его внутренний крейт.
publish = false
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
# === Cryptography ===
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
# parallel: дорожки Argon2id считаются на нескольких ядрах. Результат тот же,
# что у последовательного расчёта, — меняется только время входа.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.20"

# === Windows-only RAM Hardening ===
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
default = []
