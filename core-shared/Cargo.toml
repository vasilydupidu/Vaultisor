[package]
name = "core-shared"
version = "2.0.0"
authors = ["Vaultisor"]
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
# === Cryptography ===
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"
ml-kem = "0.2"

# === Serialization ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"

# === Windows-only RAM Hardening ===
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
default = []
