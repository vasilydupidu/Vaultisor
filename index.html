<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0CA49F" />
    <!-- Статический CSP как defense-in-depth, если HTML открыт вне Tauri.
         Политика не дублируется вручную — Vite подставляет
         сюда строку из src-tauri/tauri.conf.json при production-сборке и
         удаляет тег в dev-режиме, где Vite нужен inline-preamble React Refresh
         и WebSocket для HMR. Раньше расхождение двух копий политики молча
         ломало `tauri dev`. -->
    <meta http-equiv="Content-Security-Policy" content="__VAULTISOR_CSP__" />
    <title>Vaultisor</title>
    <!-- Шрифты подключены локально через CSS, оффлайн-friendly: см. styles.css -->
  </head>
  <body class="bg-ink-950 text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
