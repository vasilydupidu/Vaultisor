[package]
name = "vaultisor"
version = "5.1.0"
description = "Vaultisor — local secure vault for technical secrets"
authors = ["Vaultisor"]
license = "GPL-3.0-only"
# На crates.io не публикуется: это приложение и его внутренний крейт.
publish = false
edition = "2021"
rust-version = "1.77"


[lib]
name = "vaultisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# === Tauri core ===
# `devtools` не входит в релизные фичи — иначе инспектор WebView
# компилировался в прод-бинарник (CWE-489). Для отладки: сборка с
# `--features devtools` (см. [features] ниже).
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
# Один экземпляр приложения: повторный запуск .exe не стартует второй процесс,
# а фокусирует уже открытое окно (desktop-only).
tauri-plugin-single-instance = "2.2"

# === Сериализация ===
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# === Логирование (минимальное, без отправки куда-либо) ===
log = "0.4"
tauri-plugin-log = "2.2"

# === Криптография ===
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"

# === Хранилище ===
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
# SQLCipher (форк SQLite с прозрачным шифрованием страниц AES-256-CBC + HMAC-SHA512).
# vendored-openssl собирает OpenSSL из исходников — требует Perl + NASM на хосте.
# Используется ТОЛЬКО для records-БД (записи + поля); meta-БД хранится открытой,
# чтобы recovery-cascade мог прочитать wrapped_master_key до разворачивания
# SQLCipher-ключа.

# === Утилиты ===
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tempfile = "3.13"
once_cell = "1.20"
parking_lot = "0.12"
# tokio: нужен для async-команд Tauri (vault_create / recovery_restore →
# Windows Hello / TPM async-подпись). Сетевые крейты (axum/rustls/rcgen/
# tower-http) удалены; PWA и QR-перенос на телефон удалены полностью —
# продукт полностью локальный, без сетевой поверхности.
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
core-shared = { path = "../core-shared" }
p256 = { version = "0.13", features = ["ecdsa"] }

# === Windows-only API ===
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Power",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # WNDCLASSW/RegisterClassW объявлены под фичей Gdi (в них есть HBRUSH).
    # Нужны для message-only окна наблюдателя за блокировкой сеанса.
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    # TBS — определение версии TPM (2.0 vs 1.x) для гейта Device Secret.
    "Win32_System_TpmBaseServices",
    # WinRT остаётся для restricted migration старых CNG Hello vaults.
    # Новый Enhanced flow использует native WebAuthn platform credential.
    "Foundation",
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography_Core",
    "Storage_Streams",
    # CNG для проверки наличия TPM-провайдера.
    "Win32_Security_Cryptography_Catalog",
    # Interop: IUserConsentVerifierInterop для HWND-привязки Hello prompt.
    "Win32_System_WinRT",
] }
windows-core = "0.62"
windows-future = "0.3"

[features]
# По умолчанию — продакшн-флаги.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[dev-dependencies]
proptest = "1.5"
tempfile = "3.13"
